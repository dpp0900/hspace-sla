{% extends "base.html" %}
{% block title %}{{ title }} · SLA 테스트 러너{% endblock %}
{% block content %}
<section class="hero-band">
  <div class="hero-copy">
    <p class="eyebrow">스위트 YAML</p>
    <h1>{{ title }}</h1>
    <p class="hero-note">폼에서 다루기 어려운 여러 시나리오와 고급 필드를 직접 편집합니다.</p>
  </div>
  <div class="actions">
    <a class="button" href="/guide" target="_blank" rel="noreferrer">YAML 가이드</a>
    {% if helper_url %}
    <a class="button" href="{{ helper_url }}">쉬운 편집 사용</a>
    {% endif %}
    <a class="button" href="{{ back_url|default('/suites') }}">뒤로</a>
  </div>
</section>

<section class="panel">
  {% if error %}
  <div class="alert">{{ error }}</div>
  {% endif %}
  <form class="yaml-form" action="{{ action }}" method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label for="yaml_text">YAML</label>
    <textarea id="yaml_text" name="yaml_text" spellcheck="false">{{ yaml_text }}</textarea>
    <div class="form-actions">
      <button class="button primary" type="submit">저장</button>
    </div>
  </form>
</section>
{% endblock %}
