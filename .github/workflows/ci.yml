name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile Python modules
        run: python -m py_compile launch_android_app.py $(find sla_launcher sla_app scripts -name '*.py')

      - name: Run tests
        run: python -m pytest tests

      - name: Validate Compose file
        run: docker compose config

      - name: Build Docker image
        run: docker build --build-arg SLA_BUILD_SHA=${{ github.sha }} -t hspace-sla-runner:ci .

      - name: Smoke test Docker image
        run: |
          trap 'docker rm -f sla-ci >/dev/null 2>&1 || true' EXIT
          docker run -d --name sla-ci \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            -p 127.0.0.1::8000 \
            -e SLA_START_APPIUM=false \
            hspace-sla-runner:ci
          port="$(docker port sla-ci 8000/tcp | sed 's/.*://')"
          base="http://127.0.0.1:${port}"
          for i in {1..15}; do
            if curl -fsS "${base}/healthz" >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS "${base}/healthz"
          curl -fsS "${base}/readyz"
          curl -fsS "${base}/version"
          curl -fsS "${base}/metrics"

      - name: Smoke test Docker image in production mode
        run: |
          trap 'docker rm -f sla-ci-prod >/dev/null 2>&1 || true' EXIT
          password="verify-production-password-32chars"
          csrf="verify-production-csrf-secret-32chars"
          docker run -d --name sla-ci-prod \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            -p 127.0.0.1::8000 \
            -e SLA_ENV=production \
            -e SLA_BUILD_SHA=${{ github.sha }} \
            -e SLA_START_APPIUM=false \
            -e SLA_BASIC_AUTH_USER=operator \
            -e SLA_BASIC_AUTH_PASSWORD="${password}" \
            -e SLA_CSRF_SECRET="${csrf}" \
            -e SLA_TRUSTED_ORIGINS=http://127.0.0.1 \
            -e SLA_ALLOWED_HOSTS=127.0.0.1,localhost \
            hspace-sla-runner:ci
          port="$(docker port sla-ci-prod 8000/tcp | sed 's/.*://')"
          base="http://127.0.0.1:${port}"
          for i in {1..15}; do
            if curl -fsS "${base}/healthz" >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS "${base}/healthz"
          curl -fsS "${base}/readyz"
          test "$(curl -s -o /dev/null -w "%{http_code}" "${base}/version")" = "401"
          curl -fsS -u "operator:${password}" "${base}/version" | grep -q '"deployment_config_ok":true'
          test "$(curl -s -o /dev/null -w "%{http_code}" "${base}/metrics")" = "401"
          curl -fsS -u "operator:${password}" "${base}/metrics" | grep -q "sla_info"
